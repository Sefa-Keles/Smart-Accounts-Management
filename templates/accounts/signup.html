{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Account | Smart Accounts{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="sam-card p-4 p-md-5">
            <h1 class="h3 mb-2">Create your account</h1>
            <p class="text-muted mb-4">Start tracking receipts and transactions in one place.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-sam w-100 mt-2">Sign Up</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
